- name: Configure web server
  hosts: web
  become: true
  tasks:
    - name: Install nginx
      apt:
        name: nginx
        state: present
        update_cache: true
    - name: Custom index page
      copy:
        content: "Hello from Ansible - Capstone Project 15\n"
        dest: /var/www/html/index.html
    - name: Enable and start nginx
      service:
        name: nginx
        state: started
        enabled: true
